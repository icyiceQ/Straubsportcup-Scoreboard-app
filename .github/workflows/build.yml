# Baut die App für Windows (x64, ARM64) und macOS (Apple Silicon).
# Ergebnisse: in GitHub unter Actions → Lauf → "Artifacts".
# Bei einem Tag wie v1.0.1 werden die Dateien zusätzlich als Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist
            files: dist/*.exe
          - name: macos-arm64
            os: macos-latest          # Apple Silicon runner
            script: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: Unihockey-Scoreboard-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
