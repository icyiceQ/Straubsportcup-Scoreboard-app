# Baut die App für Windows (x64 und ARM64).
# Ergebnisse: in GitHub unter Actions → Lauf → "Artifacts".
# Bei einem Tag wie v1.0.1 werden die Dateien zusätzlich als Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Unihockey-Scoreboard-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
